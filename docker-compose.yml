# SQL Server for anyone without LocalDB — Linux, macOS, or a Windows machine where LocalDB is
# not installed. LocalDB remains the default; this is the portable alternative.
#
#   docker compose up -d
#
# Then point the API at it by overriding the connection string, for example:
#
#   $env:ConnectionStrings__ProductManagerDatabase="Server=localhost,1433;Database=ProductManager;User Id=sa;Password=Your_strong_Passw0rd;TrustServerCertificate=True"
#   cd backend/src/ProductManager.Api && dotnet run
#
# The API applies migrations and seeds on startup in Development, so nothing else is needed.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: productmanager-sqlserver
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'Your_strong_Passw0rd'
      MSSQL_PID: 'Developer'
    ports:
      - '1433:1433'
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # The API's own retry policy covers brief blips, but this stops `docker compose up --wait`
      # reporting success before the server can actually accept a connection.
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sqlserver-data:
